{% set name = "twisted" %}
{% set version = "26.10.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 5f0355403e507fc23ceea85e9dbb4bc59335aabde41dd324e8b8cea180dd38de
  patches:
    # Windows/py3.12: the PureWindowsPath import is guarded by `sys.version_info <= (3, 12)`
    # while _isreserved() (which uses it) is defined for `< (3, 13)`, so every FilePath
    # check raises NameError. Still broken upstream on trunk; drop when upstream fixes it.
    - patches/fix-purewindowspath-import.patch  # [win and py ==312]

build:
  number: 0
  entry_points:
    - cftp = twisted.conch.scripts.cftp:run
    - ckeygen = twisted.conch.scripts.ckeygen:run
    - conch = twisted.conch.scripts.conch:run
    - mailmail = twisted.mail.scripts.mailmail:run
    - pyhtmlizer = twisted.scripts.htmlizer:run
    - tkconch = twisted.conch.scripts.tkconch:run
    - trial = twisted.scripts.trial:run
    - twist = twisted.application.twist._twist:Twist.main
    - twistd = twisted.scripts.twistd:run
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling >=1.10.0
    - hatch-fancy-pypi-readme >=22.5.0
    - incremental >=24.7.1
  run:
    - python
    - zope.interface >=8
    - constantly >=15.1
    - incremental >=24.7.0
    - automat >=24.8.1
    - hyperlink >=18.0.0
    - attrs >=22.2.0
    - typing_extensions >=4.13.2
    # tls
    - pyopenssl >=25.3.0
    - service_identity >=21.1.0
    - idna >=2.5
    # conch
    - cryptography >=46
    - appdirs >=1.4.0
    - bcrypt >=3.2.1
    # websocket
    - wsproto >=1.2.0
    # windows-platform
    - twisted-iocpsupport >=1.0.2  # [win]
    - pywin32 !=226  # [win]
  run_constrained:
    # Moved all the crypto and tls stuff under 'run'
    # serial
    - pyserial >=3.0
    # macos-platform
    - pyobjc-core >=12  # [osx]
    - pyobjc-framework-cfnetwork >=12  # [osx]
    - pyobjc-framework-cocoa >=12  # [osx]
    # http2
    - h2 >=3.2,<5.0
    - priority >=1.1.0,<2.0

test:
  imports:
    - twisted
    - twisted._threads
    - twisted.application
    - twisted.application.runner
    - twisted.application.twist
    - twisted.conch
    - twisted.conch.client
    - twisted.conch.insults
    - twisted.conch.openssh_compat
    - twisted.conch.scripts
    - twisted.conch.ssh
    - twisted.conch.ui
    - twisted.cred
    - twisted.enterprise
    - twisted.internet
    - twisted.internet.iocpreactor  # [win]
    - twisted.logger
    - twisted.mail
    - twisted.mail.scripts
    - twisted.names
    - twisted.pair
    - twisted.persisted
    - twisted.plugins
    - twisted.positioning
    - twisted.protocols
    - twisted.protocols.haproxy
    - twisted.python
    - twisted.runner
    - twisted.scripts
    - twisted.spread
    - twisted.tap
    - twisted.trial
    - twisted.trial._dist
    - twisted.web
    - twisted.web._auth
    - twisted.words
    - twisted.words.im
    - twisted.words.protocols
    - twisted.words.protocols.jabber
    - twisted.words.xish
  requires:
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    # Upstream's suite is trial-based, so `pytest -vv` is not applicable. The full
    # `twisted` package cannot run here: twisted.test needs cython-test-exception-raiser
    # (not on pkgs/main) and twisted.internet/twisted.web/twisted.trial error on the
    # platform reactor tests. The subset below needs no extra test dependencies.
    - python -m twisted.trial
      twisted._threads twisted.application twisted.cred twisted.enterprise
      twisted.logger twisted.mail twisted.names twisted.pair twisted.persisted
      twisted.positioning twisted.runner twisted.scripts twisted.spread
      twisted.tap twisted.words
    - cftp --help  # [not win]
    - conch --help  # [not win]
    - ckeygen --help
    - mailmail --version
    - pyhtmlizer --help
    # _tkinter.TclError: no display name and no $DISPLAY environment variable
    - tkconch --help  # [win]
    - trial --help
    - twist --help
    - twistd --help

about:
  home: https://twisted.org
  license: MIT
  license_file: LICENSE
  license_family: MIT
  summary: An asynchronous networking framework written in Python
  description: |
    Twisted is an event-based framework for internet applications, written in Python.
  doc_url: https://docs.twisted.org
  dev_url: https://github.com/twisted/twisted

extra:
  recipe-maintainers:
    - nehaljwani
    - ocefpaf
